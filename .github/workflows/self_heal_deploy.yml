name: Automated Self-Calibration and Deployment

on:
  push:
    paths:
      - 'static/uploads/telemetry_logs/**'
  workflow_dispatch:

jobs:
  self-heal:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-glx libglib2.0-0

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ultralytics roboflow PyYAML albumentations

      - name: Execute Self-Calibration
        run: |
          python3 self_heal.py

      - name: Run Local Verification Tests
        run: |
          python3 test_local.py

      - name: Run Integration Field Scenarios
        run: |
          python3 tests/test_field_scenarios.py

      - name: Commit and Push Updated Weights
        if: success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add chilli_pest_model.pt weights/chilli_pest_model.onnx
          git commit -m "Auto-calibrate and update model weights [skip ci]" || echo "No changes to commit"
          git push origin main
